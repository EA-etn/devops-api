name: CI/CD

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

env:
  # Arquitecturas para las que se construye la imagen:
  #   amd64 -> PCs y servidores x86
  #   arm64 -> Raspberry Pi 3/4/5 (SO de 64 bits), Apple Silicon, AWS Graviton
  PLATFORMS: linux/amd64,linux/arm64

jobs:
  lint-test:
    name: Lint y tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: |
          ruff check .
          ruff format --check .

      - name: Tests (pytest)
        run: pytest -v

  build-push:
    name: Build y push de la imagen
    needs: lint-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5

      # QEMU emula otros procesadores (ARM) en el runner x86 de GitHub
      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - name: Login en GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Metadatos (tags y labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=sha,prefix=sha-

      - name: Build multi-arquitectura (y push si no es PR)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ env.PLATFORMS }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: APP_VERSION=${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # En los PR arrancamos la imagen de CADA arquitectura y comprobamos /health.
      # La de arm64 corre emulada con QEMU: si arranca aquí, arrancará en una Raspberry Pi.
      - name: Smoke test por arquitectura
        if: github.event_name == 'pull_request'
        run: |
          for platform in ${PLATFORMS//,/ }; do
            arch="${platform#linux/}"
            echo "::group::Smoke test $platform"
            docker buildx build --platform "$platform" --load \
              --cache-from type=gha -t "devops-api:test-$arch" .
            docker run -d --name "api-$arch" --platform "$platform" \
              -p 8000:8000 "devops-api:test-$arch"
            ok=0
            for i in $(seq 1 30); do
              if curl -fs localhost:8000/health; then ok=1; break; fi
              sleep 2
            done
            echo
            docker exec "api-$arch" uname -m
            [ "$ok" = 1 ] || { docker logs "api-$arch"; exit 1; }
            docker rm -f "api-$arch"
            echo "::endgroup::"
          done
