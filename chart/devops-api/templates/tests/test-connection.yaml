apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "devops-api.fullname" . }}-test"
  labels:
    {{- include "devops-api.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  automountServiceAccountToken: false
  securityContext:
    runAsNonRoot: true
    runAsUser: 10001
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: test
      # Reutiliza la imagen de la app (ya está en el nodo): no hace falta otra imagen
      image: {{ include "devops-api.image" . | quote }}
      imagePullPolicy: {{ .Values.image.pullPolicy }}
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: ["ALL"]
      command:
        - python
        - -c
        - |
          import json, urllib.request
          base = "http://{{ include "devops-api.fullname" . }}:{{ .Values.service.port }}"
          for path in ("/health", "/info", "/metrics"):
              r = urllib.request.urlopen(base + path, timeout=5)
              assert r.status == 200, path
              print("OK", path)
          print(json.load(urllib.request.urlopen(base + "/info")))
      resources:
        limits:
          memory: 64Mi
